# Publishes the Java SDK to Maven Central (com.bmailu:bmailu). Runs when a tag java/vX.Y.Z is pushed.
# Secrets: CENTRAL_USERNAME + CENTRAL_PASSWORD (Central Portal user token), MAVEN_GPG_PRIVATE_KEY + MAVEN_GPG_PASSPHRASE.
name: Publish Java SDK
on:
  push:
    tags: ['java/v*']
jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: |
          test "java/v$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$GITHUB_REF_NAME"
          mvn -B -P release -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
